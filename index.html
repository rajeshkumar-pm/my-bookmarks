<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookmarks (4)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Postman-style CSS variables ── */
:root[data-theme="dark"]{
  --bg:       #1A1A2E;
  --bg2:      #16213E;
  --bg3:      #0F3460;
  --border:   #2a2f5a;
  --text:     #e8eaf6;
  --text2:    #9fa8da;
  --text3:    #5c6bc0;
  --accent:   #FF6C37;
  --accent2:  #ff8a65;
  --link:     #82b1ff;
  --hover:    #1e2b5e;
  --row-sep:  #1e2347;
  --thumb:    #3d4a8a;
}
:root[data-theme="light"]{
  --bg:       #ffffff;
  --bg2:      #f5f5f5;
  --bg3:      #eeeeee;
  --border:   #e0e0e0;
  --text:     #212121;
  --text2:    #616161;
  --text3:    #9e9e9e;
  --accent:   #FF6C37;
  --accent2:  #e64a19;
  --link:     #FF6C37;
  --hover:    #fff3e0;
  --row-sep:  #f5f5f5;
  --thumb:    #bdbdbd;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,-apple-system,sans-serif;font-size:11px;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit}
button{background:none;border:none;cursor:pointer;font:inherit;color:inherit;text-align:left;width:100%}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--thumb);border-radius:2px}

/* ── shell ── */
.sh{display:flex;flex-direction:column;height:100vh}

/* ── topbar 38px ── */
.tb{height:38px;background:var(--bg2);border-bottom:2px solid var(--accent);display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0}
.br{font-weight:700;font-size:12px;color:var(--accent);white-space:nowrap;letter-spacing:.3px}
.sw{position:relative;flex:1;max-width:300px}
.sw input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:3px 8px 3px 24px;font-size:10.5px;color:var(--text);outline:none;font-family:inherit}
.sw input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,108,55,.15)}
.sw svg{position:absolute;left:7px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.ts{margin-left:auto;font-size:10px;color:var(--text3);white-space:nowrap;display:flex;gap:8px}
.ts b{color:var(--text2)}
.el{font-size:10px;color:var(--accent);padding:2px 7px;border:1px solid var(--accent);border-radius:4px;white-space:nowrap;font-weight:500}
.el:hover{background:var(--accent);color:#fff}
/* theme toggle */
.tt-btn{font-size:14px;padding:2px 4px;border-radius:4px;color:var(--text2);transition:background .1s}
.tt-btn:hover{background:var(--bg3)}

/* ── body ── */
.bd{display:flex;flex:1;overflow:hidden}

/* ── sidebar 138px ── */
.sb{width:138px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:4px;display:flex;flex-direction:column;gap:1px}
.nav{display:flex;align-items:center;gap:4px;padding:3px 5px;border-radius:4px;font-size:10.5px;color:var(--text2);transition:background .1s,color .1s;font-family:inherit}
.nav:hover,.nav.active{background:var(--hover);color:var(--text)}
.nav.active .lb{font-weight:600}
.d{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.lb{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:10.5px}
.n{font-size:9.5px;font-weight:700;flex-shrink:0}

/* ── content ── */
.ct{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ── panel ── */
.panel{display:none;flex-direction:column;height:100%;overflow:hidden}

/* ── panel header 28px ── */
.ph{display:flex;align-items:center;gap:6px;padding:0 10px;height:28px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;font-size:10.5px;color:var(--text2)}
.pc{font-size:9.5px;font-weight:700;margin-left:4px}
.pu{margin-left:auto;font-size:9.5px;color:var(--text3)}

/* ── grid: 3 columns ── */
.gr{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);align-content:start}
@media(max-width:1100px){.gr{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.gr{grid-template-columns:1fr}}

/* ── row 22px ── */
.r{display:flex;align-items:center;gap:5px;padding:0 8px;height:22px;border-bottom:1px solid var(--row-sep);border-right:1px solid var(--row-sep);overflow:hidden;position:relative;transition:background .08s}
.r::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c,var(--accent));opacity:0;transition:opacity .08s}
.r:hover{background:var(--hover)}
.r:hover::before{opacity:1}
.fi{width:12px;height:12px;flex-shrink:0;border-radius:2px;object-fit:contain}
.rt{flex:1;font-size:11px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dm{font-size:9.5px;color:var(--text3);white-space:nowrap;flex-shrink:0;margin-left:3px;max-width:90px;overflow:hidden;text-overflow:ellipsis}

.hidden{display:none!important}
.empty{padding:40px;text-align:center;color:var(--text3);font-size:12px}
</style>
</head>
<body>
<div class="sh">
  <div class="tb">
    <span class="br">🔖 Bookmarks</span>
    <div class="sw">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="q" placeholder="Search all bookmarks…" autocomplete="off">
    </div>
    <div class="ts"><span><b>4</b> links</span><span><b>4</b> cats</span></div>
    <button class="tt-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle light/dark">🌓</button>
    <a class="el" href="https://rajeshkumar-pm.github.io/my-bookmarks/" target="_blank">↗ Live</a>
  </div>
  <div class="bd">
    <div class="sb" id="sb"><button class="nav active" data-cat="observability" onclick="showCat('observability',this)"><span class="d" style="background:#06b6d4"></span><span class="lb">📡 Observability</span><span class="n" style="color:#06b6d4">1</span></button><button class="nav" data-cat="design-docs" onclick="showCat('design-docs',this)"><span class="d" style="background:#8b5cf6"></span><span class="lb">📐 Design Docs</span><span class="n" style="color:#8b5cf6">1</span></button><button class="nav" data-cat="apis-integrations" onclick="showCat('apis-integrations',this)"><span class="d" style="background:#3b82f6"></span><span class="lb">🔌 APIs & Integrations</span><span class="n" style="color:#3b82f6">1</span></button><button class="nav" data-cat="communication" onclick="showCat('communication',this)"><span class="d" style="background:#14b8a6"></span><span class="lb">💬 Communication</span><span class="n" style="color:#14b8a6">1</span></button></div>
    <div class="ct" id="ct">
      <div class="panel" id="p-observability" style="display:flex"><div class="ph" style="border-left:2px solid #06b6d4">📡 <b>Observability</b><span class="pc" style="color:#06b6d4">1</span><span class="pu">2025-07-01</span></div><div class="gr" id="gr-observability"><a class="r" href="https://one.newrelic.com/dashboards/abc" target="_blank" rel="noopener" data-s="new relic dashboard production observability dashboard. observability one.newrelic.com newrelic monitoring observability" title="Production observability dashboard." style="--c:#06b6d4"><img class="fi" src="https://www.google.com/s2/favicons?domain=one.newrelic.com&sz=32" loading="lazy" onerror="this.style.visibility='hidden'"><span class="rt">New Relic Dashboard</span><span class="dm">one.newrelic.com</span></a></div></div><div class="panel" id="p-design-docs" style="display:none"><div class="ph" style="border-left:2px solid #8b5cf6">📐 <b>Design Docs</b><span class="pc" style="color:#8b5cf6">1</span><span class="pu">2025-07-01</span></div><div class="gr" id="gr-design-docs"><a class="r" href="https://docs.example.com/project-ref" target="_blank" rel="noopener" data-s="project reference document design and architecture reference document. design docs docs.example.com design reference docs" title="Design and architecture reference document." style="--c:#8b5cf6"><img class="fi" src="https://www.google.com/s2/favicons?domain=docs.example.com&sz=32" loading="lazy" onerror="this.style.visibility='hidden'"><span class="rt">Project Reference Document</span><span class="dm">docs.example.com</span></a></div></div><div class="panel" id="p-apis-integrations" style="display:none"><div class="ph" style="border-left:2px solid #3b82f6">🔌 <b>APIs & Integrations</b><span class="pc" style="color:#3b82f6">1</span><span class="pu">2025-07-01</span></div><div class="gr" id="gr-apis-integrations"><a class="r" href="https://postman-iam.example.com/catalogue" target="_blank" rel="noopener" data-s="iam catalogue apis internal iam api catalogue reference. apis & integrations postman-iam.example.com iam api postman" title="Internal IAM API catalogue reference." style="--c:#3b82f6"><img class="fi" src="https://www.google.com/s2/favicons?domain=postman-iam.example.com&sz=32" loading="lazy" onerror="this.style.visibility='hidden'"><span class="rt">IAM Catalogue APIs</span><span class="dm">postman-iam.example.com</span></a></div></div><div class="panel" id="p-communication" style="display:none"><div class="ph" style="border-left:2px solid #14b8a6">💬 <b>Communication</b><span class="pc" style="color:#14b8a6">1</span><span class="pu">2025-07-01</span></div><div class="gr" id="gr-communication"><a class="r" href="https://slack.com/archives/C123/p456" target="_blank" rel="noopener" data-s="slack dm thread important slack discussion thread. communication slack.com slack thread" title="Important Slack discussion thread." style="--c:#14b8a6"><img class="fi" src="https://www.google.com/s2/favicons?domain=slack.com&sz=32" loading="lazy" onerror="this.style.visibility='hidden'"><span class="rt">Slack DM Thread</span><span class="dm">slack.com</span></a></div></div>
    </div>
  </div>
</div>
<script>
var A='observability';
// ── theme ────────────────────────────────────────────────────────────────────
(function(){
  var t=localStorage.getItem('bm-theme')||'dark';
  document.documentElement.setAttribute('data-theme',t);
})();
function toggleTheme(){
  var el=document.documentElement;
  var t=el.getAttribute('data-theme')==='dark'?'light':'dark';
  el.setAttribute('data-theme',t);
  localStorage.setItem('bm-theme',t);
}
// ── navigation ───────────────────────────────────────────────────────────────
function showCat(c,b){
  A=c;
  document.querySelectorAll('.panel').forEach(p=>p.style.display='none');
  document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  var p=document.getElementById('p-'+c);if(p)p.style.display='flex';
  if(b)b.classList.add('active');
  var q=document.getElementById('q');if(q){q.value='';showAll(c);}
}
function showAll(c){
  var g=document.getElementById('gr-'+c);
  if(g)g.querySelectorAll('.r').forEach(r=>r.classList.remove('hidden'));
}
// ── search ───────────────────────────────────────────────────────────────────
document.getElementById('q').addEventListener('input',function(){
  var q=this.value.toLowerCase().trim();
  if(q.length>1){
    document.querySelectorAll('.panel').forEach(function(p){
      var ok=false;
      p.querySelectorAll('.r').forEach(function(r){var m=r.dataset.s.includes(q);r.classList.toggle('hidden',!m);if(m)ok=true;});
      p.style.display=ok?'flex':'none';
    });
    document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));
  }else{
    document.querySelectorAll('.panel').forEach(function(p){p.style.display='none';p.querySelectorAll('.r').forEach(r=>r.classList.remove('hidden'));});
    var ap=document.getElementById('p-'+A);if(ap)ap.style.display='flex';
    document.querySelectorAll('.nav').forEach(function(n){if(n.dataset.cat===A)n.classList.add('active');});
  }
});
</script>
</body>
</html>
