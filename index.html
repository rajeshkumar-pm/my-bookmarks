.ct{flex:1;overflow:hidden;display:flex;flex-direction:column}
.panel{display:none;flex-direction:column;height:100%;overflow:hidden}

.gr{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);align-content:start}
@media(max-width:1100px){.gr{grid-template-columns:repeat(2,1fr)}}
@media(max-width:700px){.gr{grid-template-columns:1fr}}
.r{display:flex;align-items:center;gap:5px;padding:0 8px;height:22px;border-bottom:1px solid #161b22;border-right:1px solid #161b22;overflow:hidden;position:relative;transition:background .08s}
.r::before{content:'';position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--c,#388bfd);opacity:0;transition:opacity .08s}
.r:hover{background:#1c2128}.r:hover::before{opacity:1}
.fi{width:12px;height:12px;flex-shrink:0;border-radius:2px;object-fit:contain}
.tt{flex:1;font-size:11px;font-weight:500;color:#c9d1d9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dm{font-size:9.5px;color:#484f58;white-space:nowrap;flex-shrink:0;margin-left:3px;max-width:90px;overflow:hidden;text-overflow:ellipsis}
.hidden{display:none!important}.empty{padding:40px;text-align:center;color:#484f58;font-size:12px}

<script>
var A='observability';
function showCat(c,b){A=c;document.querySelectorAll('.panel').forEach(p=>p.style.display='none');document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'));var p=document.getElementById('p-'+c);if(p)p.style.display='flex';if(b)b.classList.add('active');var q=document.getElementById('q');if(q){q.value='';showAll(c);}}
function showAll(c){var g=document.getElementById('gr-'+c);if(g)g.querySelectorAll('.r').forEach(r=>r.classList.remove('hidden'));}
document.getElementById('q').addEventListener('input',function(){var q=this.value.toLowerCase().trim();if(q.length>1){document.querySelectorAll('.panel').forEach(function(p){var ok=false;p.querySelectorAll('.r').forEach(function(r){var m=r.dataset.s.includes(q);r.classList.toggle('hidden',!m);if(m)ok=true;});p.style.display=ok?'flex':'none';});document.querySelectorAll('.nav').forEach(n=>n.classList.remove('active'))}else{document.querySelectorAll('.panel').forEach(function(p){p.style.display='none';p.querySelectorAll('.r').forEach(r=>r.classList.remove('hidden'));});var ap=document.getElementById('p-'+A);if(ap)ap.style.display='flex';document.querySelectorAll('.nav').forEach(function(n){if(n.dataset.cat===A)n.classList.add('active');});}});
